<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRZ Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0c0c0c;
            --bg-card: #161616;
            --border-color: #262626;
            --accent-gold: #f3ba2f;
            --accent-gradient: linear-gradient(135deg, #f3ba2f 0%, #d49a1a 100%);
            --text-main: #ffffff;
            --text-muted: #7c7c82;
            --danger: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* Шапка приложения в точности как на скрине */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(12, 12, 12, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--danger);
            border-radius: 50%;
        }

        .balance-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .balance-pill span {
            color: var(--accent-gold);
        }

        .admin-gear {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            display: none; /* Показывать только для whyheavens */
            margin-left: 10px;
        }

        /* Основной контейнер */
        .container {
            padding: 16px 20px;
        }

        /* Карточка-модуль сверху (как "Top up your balance") */
        .top-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .top-card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .toggle-group {
            display: flex;
            background: var(--bg-main);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        /* Сетка подарков */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .gift-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            position: relative;
            cursor: pointer;
        }

        .gift-img {
            width: 74px;
            height: 74px;
            object-fit: contain;
            margin: 8px auto 12px;
            display: block;
        }

        .gift-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gift-price-badge {
            display: inline-block;
            background: rgba(243, 186, 47, 0.1);
            color: var(--accent-gold);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .empty-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 30px 0;
            grid-column: span 2;
        }

        /* Кнопки */
        .main-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        /* Модальные окна */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-card);
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            border-top: 1px solid var(--border-color);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .modal.open .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-gold);
        }

        .input-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        /* Нижняя навигация как на скрине */
        nav.bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(12, 12, 12, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 20px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .nav-item.active {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <div class="status-dot"></div>
            <span id="username-display">whyheavens</span>
        </div>
        <div style="display: flex; align-items: center;">
            <div class="balance-pill">
                <span id="user-balance">9093234</span> ⭐
            </div>
            <button id="admin-gear" class="admin-gear" onclick="openAdminModal()">⚙️</button>
        </div>
    </header>

    <div class="container">
        <!-- Блок статистики / баланса в стиле скрина -->
        <div class="top-card">
            <div class="top-card-title">DRZ Gifts Hub</div>
            <div class="toggle-group">
                <div class="toggle-btn active">NFT Gifts</div>
                <div class="toggle-btn" style="opacity: 0.5;">Stickers</div>
            </div>
            <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">Статус системы</div>
            <div style="font-size: 14px; font-weight: 600; color: #34c759;">● Активна (Защита whyheavens)</div>
        </div>

        <div class="section-title">Доступные подарки</div>
        
        <!-- Сетка подарков (изначально пустая) -->
        <div class="gifts-grid" id="gifts-container">
            <div class="empty-text">Подарков пока нет.<br>Дождитесь добавления от администратора.</div>
        </div>
    </div>

    <!-- Модальное окно админки (Только для whyheavens) -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Добавить подарок</div>
            
            <label class="input-label">Название подарка</label>
            <input type="text" id="gift-name" class="input-field" placeholder="Например: Golden Rolex">

            <label class="input-label">Ссылка на картинку (PNG / URL)</label>
            <input type="text" id="gift-img" class="input-field" placeholder="https://...">

            <label class="input-label">Стоимость (в звездах ⭐)</label>
            <input type="number" id="gift-price" class="input-field" placeholder="500">

            <button class="main-btn" onclick="addNewGift()">Опубликовать подарок</button>
            <button class="main-btn" style="background: var(--border-color); color: var(--text-main); margin-top: 8px;" onclick="closeAdminModal()">Отмена</button>
        </div>
    </div>

    <!-- Нижняя панель навигации -->
    <nav class="bottom-nav">
        <button class="nav-item active">
            <span>🎁</span>
        </button>
        <button class="nav-item" onclick="alert('Раздел профиля')">
            <span>📦</span>
        </button>
        <button class="nav-item" onclick="alert('История транзакций')">
            <span>📊</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Проверяем пользователя
        const user = tg.initDataUnsafe?.user;
        const username = user ? user.username : 'whyheavens'; // Если открыто вне тг для теста — ставим whyheavens

        document.getElementById('username-display').innerText = username || 'guest';

        // Кнопка настройки видна ТОЛЬКО для пользователя whyheavens
        if (username === 'whyheavens') {
            document.getElementById('admin-gear').style.display = 'block';
        }

        // Хранилище подарков (пустое изначально)
        let gifts = JSON.parse(localStorage.getItem('drz_custom_gifts')) || [];

        function renderGifts() {
            const container = document.getElementById('gifts-container');
            if (gifts.length === 0) {
                container.innerHTML = `<div class="empty-text">Подарков пока нет.<br>Дождитесь добавления от администратора.</div>`;
                return;
            }

            container.innerHTML = '';
            gifts.forEach((gift, index) => {
                container.innerHTML += `
                    <div class="gift-card" onclick="alert('Подарок: ${gift.name}')">
                        <img class="gift-img" src="${gift.img}" alt="">
                        <div class="gift-name">${gift.name}</div>
                        <div class="gift-price-badge">⭐ ${gift.price}</div>
                    </div>
                `;
            });
        }

        function openAdminModal() {
            document.getElementById('admin-modal').classList.add('open');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.remove('open');
        }

        function addNewGift() {
            const name = document.getElementById('gift-name').value.trim();
            const img = document.getElementById('gift-img').value.trim();
            const price = parseInt(document.getElementById('gift-price').value);

            if (!name || !img || isNaN(price)) {
                alert("Заполните корректно все поля!");
                return;
            }

            gifts.push({ name, img, price });
            localStorage.setItem('drz_custom_gifts', JSON.stringify(gifts));

            renderGifts();
            closeAdminModal();

            // Очистка полей
            document.getElementById('gift-name').value = '';
            document.getElementById('gift-img').value = '';
            document.getElementById('gift-price').value = '';

            if(tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // Первичный рендер
        renderGifts();
    </script>
</body>
</html>
